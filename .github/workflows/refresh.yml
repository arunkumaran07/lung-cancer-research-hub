name: Daily refresh

# One refresh per day, starting at about 6:17 am Toronto time.
# GitHub can delay or drop scheduled runs when Actions is busy, so the schedule
# fires every three hours; refresh.py --daily does the work on the first run of
# each Toronto day after 6 am and the later runs exit in seconds.
on:
  schedule:
    - cron: "17 */3 * * *"   # 02:17, 05:17, 08:17, 11:17, 14:17, 17:17, 20:17, 23:17 UTC
  workflow_dispatch:          # Actions -> Daily refresh -> Run workflow: refresh now
  push:
    branches: [main]
    paths:
      - refresh.py
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh trials and papers
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 refresh.py --daily
          else
            python3 refresh.py
          fi
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Daily refresh: $(python3 -c "import json;m=json.load(open('data/meta.json'));print(f\"{m['trials']} open trials, {m['papers_added']} new papers\")")"
            git pull --rebase --quiet
            git push
          fi
